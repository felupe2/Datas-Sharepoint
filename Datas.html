<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversariantes</title>
    <style>
        /* Reset e Fontes padrão do SharePoint (Segoe UI) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "Segoe UI", "Segoe WP", Tahoma, Arial, sans-serif;
            background-color: transparent; /* Fundo transparente para se integrar ao SharePoint */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* Container do Carrossel */
        .carousel-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            padding: 10px 40px;
        }

        .carousel {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 10px;
            scroll-behavior: smooth;
        }

        .carousel::-webkit-scrollbar {
            display: none;
        }

        /* Cartões estilo Flat / Minimalista */
        .card {
            min-width: 180px;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 0 0 20px 0;
            text-align: center;
            scroll-snap-align: start;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        /* Cabeçalho com o efeito Blur idêntico à imagem enviada */
        .card-blur-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: #0076c8;
            overflow: hidden;
        }
        
        /* Simulação do efeito fluido de borrão (BLUUUR.png) */
        .card-blur-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 30%, #02b6be 0%, transparent 55%),
                        radial-gradient(circle at 75% 20%, #005A9E 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, #facc15 0%, transparent 60%),
                        radial-gradient(circle at 80% 85%, #6366f1 0%, transparent 50%);
            filter: blur(14px);
            opacity: 0.95;
        }

        /* Conteúdo do Cartão */
        .card-content {
            position: relative;
            padding-top: 20px;
            z-index: 2;
        }

        .avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background-color: #E1F0FF;
            color: #005A9E;
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            border: 4px solid #ffffff; /* Borda branca para destacar sobre o blur */
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .name {
            font-size: 15px;
            color: #201f1e;
            font-weight: 600;
            margin-bottom: 4px;
            padding: 0 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .date {
            font-size: 13px;
            color: #605e5c;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            background-color: #0078D4;
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge.hoje {
            background-color: #107C10;
        }

        /* Botões de Navegação */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            color: #005A9E;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            z-index: 10;
            transition: background-color 0.2s;
        }
        
        .nav-btn:hover {
            background-color: #f3f2f1;
        }

        .prev-btn { left: 0; }
        .next-btn { right: 0; }

        .no-birthdays {
            width: 100%;
            text-align: center;
            color: #605e5c;
            font-size: 15px;
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="carousel-wrapper">
        <button class="nav-btn prev-btn" onclick="scrollCarousel(-1)">&#10094;</button>
        <div class="carousel" id="birthday-carousel">
            </div>
        <button class="nav-btn next-btn" onclick="scrollCarousel(1)">&#10095;</button>
    </div>

    <script>
        const colaboradores = [
            { nome: "Alan Kardek da Silva Barros Neto", data: "02/01" },
            { nome: "Juciele Cristina Fappi Pinheiro", data: "22/01" },
            { nome: "Tayson Alves de Araujo", data: "22/01" },
            { nome: "Aline Helena Casagrande", data: "02/02" },
            { nome: "Luiz Antonio Costa Cunha", data: "24/02" },
            { nome: "Aline dos Passos", data: "23/03" },
            { nome: "Diego Oliveira Arantes", data: "28/03" },
            { nome: "Marcelo Andre Engelmann", data: "02/04" },
            { nome: "Felipe Goncalves dos Santos", data: "08/05" },
            { nome: "Rogers Graciano Vieira", data: "18/05" },
            { nome: "Thiago de Oliveira", data: "29/05" },
            { nome: "Wellington Alves Gold", data: "01/07" },
            { nome: "Carina Neres Silva", data: "29/07" },
            { nome: "Tiago Henrique de Arruda Paiva", data: "06/08" },
            { nome: "Nayara Olegario Ortiz do Prado", data: "15/08" },
            { nome: "Rodrigo Gonzaga Cardoso", data: "21/08" },
            { nome: "Lucas Andrade Lima", data: "04/10" },
            { nome: "Renan Breno Carvalho Sousa", data: "08/10" },
            { nome: "Rildo Rosa Gomes", data: "12/10" },
            { nome: "Joyce Parize Leidens", data: "30/10" }
        ];

        function processarAniversarios(lista) {
            const hoje = new Date();
            const anoAtual = hoje.getFullYear();
            hoje.setHours(0, 0, 0, 0);

            return lista.map(pessoa => {
                const [dia, mes] = pessa.data.split('/');
                // Força a criação do objeto de data estritamente dentro do ano corrente
                const dataNiver = new Date(anoAtual, parseInt(mes) - 1, parseInt(dia));

                const diffTempo = dataNiver.getTime() - hoje.getTime();
                const diffDias = Math.ceil(diffTempo / (1000 * 60 * 60 * 24));

                return { ...pessoa, diffDias, dataNiver };
            })
            // FILTRA: Remove estritamente quem já passou do dia de hoje neste ano
            .filter(pessoa => pessoa.dataNiver >= hoje)
            .sort((a, b) => a.diffDias - b.diffDias);
        }

        function renderizarCarrossel() {
            const carrossel = document.getElementById('birthday-carousel');
            const ordenados = processarAniversarios(colaboradores);

            carrossel.innerHTML = '';

            if (ordenados.length === 0) {
                carrossel.innerHTML = '<div class="no-birthdays">Não há mais aniversariantes este ano.</div>';
                return;
            }

            ordenados.forEach(pessoa => {
                const isHoje = pessoa.diffDias === 0;
                let textoBadge = isHoje ? "Hoje!" : `Faltam ${pessoa.diffDias} dias`;
                
                const partesNome = pessoa.nome.trim().split(' ');
                const iniciais = partesNome.length > 1 
                    ? (partesNome[0][0] + partesNome[partesNome.length - 1][0]).toUpperCase()
                    : partesNome[0][0].toUpperCase();
                
                const dataFormatada = pessoa.dataNiver.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');

                const cardHTML = `
                    <div class="card">
                        <div class="card-blur-header"></div>
                        <div class="card-content">
                            <div class="avatar">${iniciais}</div>
                            <div class="name" title="${pessoa.nome}">${pessoa.nome}</div>
                            <div class="date">${dataFormatada}</div>
                            <div class="badge ${isHoje ? 'hoje' : ''}">${textoBadge}</div>
                        </div>
                    </div>
                `;
                carrossel.innerHTML += cardHTML;
            });
        }

        function scrollCarousel(direcao) {
            const carrossel = document.getElementById('birthday-carousel');
            const scrollAmount = 196; 
            carrossel.scrollBy({ left: scrollAmount * direcao, behavior: 'smooth' });
        }

        renderizarCarrossel();
    </script>
</body>
</html>
