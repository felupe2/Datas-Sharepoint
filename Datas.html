<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversariantes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: "Segoe UI", "Segoe WP", Tahoma, Arial, sans-serif;
            background-color: transparent;
            overflow: hidden;
            color: #201f1e;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1200px;
            /* Adicionado 10px de padding na parte inferior para a caixinha não colar no fim da tela */
            padding: 5px 15px 10px 15px; 
            margin: 0 auto;
        }

        .carousel-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            padding: 0 40px;
        }

        .carousel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 5px 0 10px 0; 
            scroll-behavior: smooth;
            width: 100%;
        }
        .carousel::-webkit-scrollbar { display: none; }

        .card {
            flex: 0 0 auto; 
            width: 155px; 
            background-color: #ffffff;
            border-radius: 12px;
            padding: 0 0 16px 0;
            text-align: center;
            scroll-snap-align: start;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .card-blur-header {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 45px;
            background: #0076c8;
            overflow: hidden;
        }
        
        .card-blur-header::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 20% 30%, #02b6be 0%, transparent 55%),
                        radial-gradient(circle at 75% 20%, #005A9E 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, #facc15 0%, transparent 60%),
                        radial-gradient(circle at 80% 85%, #6366f1 0%, transparent 50%);
            filter: blur(14px);
            opacity: 0.95;
        }

        .card-content { position: relative; padding-top: 15px; z-index: 2; }

        .avatar {
            width: 55px; height: 55px; border-radius: 50%;
            background-color: #E1F0FF; color: #005A9E;
            font-size: 18px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 10px; border: 3px solid #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .name {
            font-size: 14px; color: #201f1e; font-weight: 600;
            margin-bottom: 2px; padding: 0 8px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .date { font-size: 12px; color: #605e5c; margin-bottom: 10px; }

        .badge {
            display: inline-block; background-color: #0078D4; color: white;
            font-size: 10px; font-weight: 600; padding: 4px 10px;
            border-radius: 10px; text-transform: uppercase; letter-spacing: 0.3px;
        }
        .badge.hoje { background-color: #107C10; }
        .badge.passou { background-color: #edebe9; color: #605e5c; }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background-color: #ffffff; border: 1px solid #dee2e6; color: #005A9E;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); z-index: 10;
        }
        .nav-btn:hover { background-color: #f3f2f1; }
        .prev-btn { left: 5px; }
        .next-btn { right: 5px; }

        /* Ajuste do rodapé */
        .footer-controls {
            display: flex; justify-content: flex-end; align-items: center;
            padding: 5px 40px 0 0; width: 100%;
        }

        .checkbox-label {
            font-size: 13px; color: #605e5c; display: flex;
            align-items: center; gap: 8px; cursor: pointer; user-select: none;
        }
        .checkbox-label input[type="checkbox"] { cursor: pointer; width: 15px; height: 15px; accent-color: #005A9E; }
        .no-birthdays { width: 100%; text-align: center; color: #605e5c; font-size: 14px; padding: 20px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="carousel-wrapper">
            <button class="nav-btn prev-btn" onclick="scrollCarousel(-1)">&#10094;</button>
            <div class="carousel" id="birthday-carousel">
                </div>
            <button class="nav-btn next-btn" onclick="scrollCarousel(1)">&#10095;</button>
        </div>
        
        <div class="footer-controls">
            <label class="checkbox-label">
                <input type="checkbox" id="chk-todos" onchange="renderizarCarrossel()">
                Todos Aniversariantes
            </label>
        </div>
    </div>

    <script>
        const colaboradores = [
            { nome: "Alan Kardek da Silva Barros Neto", data: "02/01" },
            { nome: "Juciele Cristina Fappi Pinheiro", data: "22/01" },
            { nome: "Tayson Alves de Araujo", data: "22/01" },
            { nome: "Aline Helena Casagrande", data: "02/02" },
            { nome: "Luiz Antonio Costa Cunha", data: "24/02" },
            { nome: "Aline dos Passos", data: "23/03" },
            { nome: "Diego Oliveira Arantes", data: "28/03" },
            { nome: "Marcelo Andre Engelmann", data: "02/04" },
            { nome: "Felipe Goncalves dos Santos", data: "08/05" },
            { nome: "Rogers Graciano Vieira", data: "18/05" },
            { nome: "Thiago de Oliveira", data: "29/05" },
            { nome: "Wellington Alves Gold", data: "01/07" },
            { nome: "Carina Neres Silva", data: "29/07" },
            { nome: "Tiago Henrique de Arruda Paiva", data: "06/08" },
            { nome: "Nayara Olegario Ortiz do Prado", data: "15/08" },
            { nome: "Rodrigo Gonzaga Cardoso", data: "21/08" },
            { nome: "Lucas Andrade Lima", data: "04/10" },
            { nome: "Renan Breno Carvalho Sousa", data: "08/10" },
            { nome: "Rildo Rosa Gomes", data: "12/10" },
            { nome: "Joyce Parize Leidens", data: "30/10" }
        ];

        function processarAniversarios(lista) {
            const chkTodos = document.getElementById('chk-todos');
            const mostrarTodos = chkTodos ? chkTodos.checked : false; 
            
            const hoje = new Date();
            const anoAtual = hoje.getFullYear();
            hoje.setHours(0, 0, 0, 0);

            let dadosProcessados = lista.map(pessoa => {
                const dataLimpa = pessoa.data.replace('-', '/');
                const [dia, mes] = dataLimpa.split('/');
                const dataNiver = new Date(anoAtual, parseInt(mes) - 1, parseInt(dia));

                const diffTempo = dataNiver.getTime() - hoje.getTime();
                const diffDias = Math.ceil(diffTempo / (1000 * 60 * 60 * 24));
                
                const valorOrdemAno = parseInt(mes) * 100 + parseInt(dia);

                return { ...pessoa, diffDias, dataNiver, valorOrdemAno };
            });

            if (mostrarTodos) {
                return dadosProcessados.sort((a, b) => a.valorOrdemAno - b.valorOrdemAno);
            } else {
                return dadosProcessados
                    .filter(pessoa => pessoa.dataNiver >= hoje)
                    .sort((a, b) => a.diffDias - b.diffDias);
            }
        }

        function renderizarCarrossel() {
            const carrossel = document.getElementById('birthday-carousel');
            if (!carrossel) return;
            
            const ordenados = processarAniversarios(colaboradores);
            let htmlFinal = "";

            if (ordenados.length === 0) {
                carrossel.innerHTML = '<div class="no-birthdays">Não há mais aniversariantes este ano.</div>';
                return;
            }

            ordenados.forEach(pessoa => {
                let classeBadge = "";
                let textoBadge = "";

                if (pessoa.diffDias === 0) {
                    classeBadge = "hoje";
                    textoBadge = "Hoje!";
                } else if (pessoa.diffDias < 0) {
                    classeBadge = "passou";
                    textoBadge = "Já passou";
                } else {
                    textoBadge = `Faltam ${pessoa.diffDias} dias`;
                }
                
                const partesNome = pessoa.nome.trim().split(/\s+/);
                const iniciais = partesNome.length > 1 
                    ? (partesNome[0][0] + partesNome[partesNome.length - 1][0]).toUpperCase()
                    : (partesNome[0][0] || "?").toUpperCase();
                
                const dataFormatada = pessoa.dataNiver.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');

                htmlFinal += `
                    <div class="card">
                        <div class="card-blur-header"></div>
                        <div class="card-content">
                            <div class="avatar">${iniciais}</div>
                            <div class="name" title="${pessoa.nome}">${pessoa.nome}</div>
                            <div class="date">${dataFormatada}</div>
                            <div class="badge ${classeBadge}">${textoBadge}</div>
                        </div>
                    </div>
                `;
            });

            carrossel.innerHTML = htmlFinal;
        }

        function scrollCarousel(direcao) {
            const carrossel = document.getElementById('birthday-carousel');
            if (!carrossel) return;
            const card = carrossel.querySelector('.card');
            if (card) {
                const scrollAmount = card.offsetWidth + 15; 
                carrossel.scrollBy({ left: scrollAmount * direcao, behavior: 'smooth' });
            }
        }

        window.onload = function() {
            renderizarCarrossel();
        };
    </script>
</body>
</html>
